name: Home Lab companion

on:
  pull_request:
    paths:
      - integrations/homelab/**
      - .github/workflows/homelab.yml
  push:
    branches: ['codex/homelab-*']
    paths:
      - integrations/homelab/**
      - .github/workflows/homelab.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: homelab-${{ github.ref }}
  cancel-in-progress: true

jobs:
  portable-core:
    name: Core on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    defaults:
      run:
        working-directory: integrations/homelab
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, matching repository CI
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0, matching repository CI
        with:
          python-version: '3.12'
      - name: Core tests with no third-party packages or model downloads
        run: python -m unittest discover -s tests -v
      - name: Compile portable entry points
        run: python -m compileall -q homelab lab.py factory.py
      - name: Parse PowerShell scripts
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $parseFailures = 0
          Get-ChildItem scripts -Filter *.ps1 | ForEach-Object {
            $scriptTokens = $null
            $scriptErrors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$scriptTokens, [ref]$scriptErrors) | Out-Null
            if ($scriptErrors.Count -gt 0) {
              $scriptErrors | Write-Error
              $parseFailures += $scriptErrors.Count
            }
          }
          if ($parseFailures -gt 0) { exit 1 }
      - name: Parse shell scripts
        if: runner.os != 'Windows'
        shell: bash
        run: |
          for script in scripts/*.sh; do
            bash -n "$script"
          done
  mcp-protocol:
    name: MCP protocol and Python floor
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: integrations/homelab
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.10'
      - name: Install optional MCP bridge dependencies
        run: python -m pip install -r requirements-mcp.txt
      - name: Full companion suite including actual stdio handshake
        run: python -m unittest discover -s tests -v
